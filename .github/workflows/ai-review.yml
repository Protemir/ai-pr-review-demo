name: ai-review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

# Только чтение кода, комментарии и статус проверки. Записи в ветки нет.
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.issue.pull_request && startsWith(github.event.comment.body, '/ai-review') && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/$NUM" > "$RUNNER_TEMP/pr.json"
          echo "number=$NUM" >> "$GITHUB_OUTPUT"
          echo "base=$(jq -r .base.sha "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Локальная LLM (Ollama на CPU раннера, код наружу не уходит)
        run: |
          MODEL=$(jq -r '.llm.model' .ai-review.json)
          curl -fsSL https://ollama.com/install.sh | sh >/dev/null 2>&1
          sudo systemctl stop ollama || true
          OLLAMA_CONTEXT_LENGTH=8192 OLLAMA_KEEP_ALIVE=30m nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version >/dev/null && break; sleep 1; done
          ollama pull "$MODEL" >/dev/null 2>&1
          ollama list

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Анализаторы (Semgrep, Ruff, Gitleaks)
        run: |
          pip install -q semgrep==1.95.0 ruff==0.7.4
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Ревью
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          node reviewer/src/main.ts
          --repo-dir . --repo "${{ github.repository }}" --pr "${{ steps.pr.outputs.number }}"
          --base "${{ steps.pr.outputs.base }}" --head "${{ steps.pr.outputs.head }}"
          --pr-json "$RUNNER_TEMP/pr.json" --out ai-review-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-report-pr${{ steps.pr.outputs.number }}
          path: ai-review-report.json
