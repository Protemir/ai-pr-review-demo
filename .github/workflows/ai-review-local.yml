name: ai-review-local-llm

# Вариант без передачи кода внешнему провайдеру: модель запускается в самом раннере через Ollama.
# На стенде заказчика вместо CPU-раннера — свой GPU-сервер (Ollama или vLLM), меняется только AI_REVIEW_BASE_URL.
on:
  workflow_dispatch:
    inputs:
      pr:
        description: Номер PR
        required: true
      model:
        description: Модель Ollama
        default: qwen2.5-coder:3b

permissions:
  contents: read
  pull-requests: read

jobs:
  review-local:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/pulls/${{ inputs.pr }}" > "$RUNNER_TEMP/pr.json"
          echo "base=$(jq -r .base.sha "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "head=$(jq -r .head.sha "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Анализаторы
        run: |
          pip install -q semgrep==1.95.0 ruff==0.7.4
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz -C "$HOME/.local/bin" gitleaks
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Локальная модель (Ollama, CPU)
        run: |
          curl -fsSL https://ollama.com/install.sh | sh >/dev/null
          sudo systemctl stop ollama || true
          OLLAMA_CONTEXT_LENGTH=16384 nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:11434/api/version && break; sleep 1; done
          time ollama pull "${{ inputs.model }}"

      - name: Ревью (только отчёт, без комментариев)
        env:
          AI_REVIEW_PROVIDER: openai-compatible
          AI_REVIEW_BASE_URL: http://localhost:11434/v1
          AI_REVIEW_MODEL: ${{ inputs.model }}
          AI_REVIEW_PRICE_IN: "0"
          AI_REVIEW_PRICE_OUT: "0"
          AI_REVIEW_MAX_INPUT: "5000"
          AI_REVIEW_MAX_OUTPUT: "1500"
        run: >-
          node reviewer/src/main.ts --dry-run --label " (локальная модель ${{ inputs.model }})"
          --repo-dir . --repo "${{ github.repository }}" --pr "${{ inputs.pr }}"
          --base "${{ steps.pr.outputs.base }}" --head "${{ steps.pr.outputs.head }}"
          --pr-json "$RUNNER_TEMP/pr.json" --out ai-review-local-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-review-local-report-pr${{ inputs.pr }}
          path: ai-review-local-report.json
